<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media</title>
</head>
<body>

    <div class="timeline-container">
        <div class="timeline" id="timeline"></div>

        <div class="input-area">
            <div id="errorMessage" class="error-message hidden"></div>

            <textarea id="postInput" placeholder="Введите текст поста..."></textarea>

            <div class="button-group">
                <button id="submitTextBtn" class="submit-btn">Отправить текст</button>
                <button id="audioRecordBtn" class="audio-btn">Записать аудио</button>
            </div>

            <div id="audioRecordingPanel" class="recording-panel hidden">
            <div class="recording-info">
                <span class="recording-icon">🔴</span>
                <span id="audioTimer">00:00</span>
            </div>
            <div class="recording-actions">
                <button id="stopRecordingBtn" class="stop-btn">⏹Остановить</button>
                <button id="cancelRecordingBtn" class="cancel-recording-btn">Отмена</button>
            </div>
        </div>

        </div>
        </div>
    </div>

    <!-- Модальное окно для ручного ввода координат -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h3>Координаты не доступны</h3>
            <p>Введите координаты вручную</p>
            <input type="text" id="manualCoords" placeholder="Широта, Долгота">
            <button id="submitCoords">Подтвердить</button>
            <button id="cancelCoords">Отмена</button>
        </div>
    </div>

</body>
</html>
